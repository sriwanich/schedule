<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>คุณกำลังออฟไลน์</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { 
            background-color: #e9f5f5; 
            font-family: 'Anuphan', sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            text-align: center;
        }
        .offline-container {
            max-width: 500px;
            padding: 20px;
        }
        .offline-icon {
            font-size: 5rem;
            color: #ff6b6b;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="offline-icon">
            <i class="bi bi-wifi-off"></i>
        </div>
        <h2>คุณกำลังออฟไลน์</h2>
        <p>ไม่สามารถเชื่อมต่อกับอินเทอร์เน็ตได้ กรุณาตรวจสอบการเชื่อมต่อของคุณ</p>
        <p>คุณยังสามารถดูข้อมูลบางส่วนที่เคยโหลดมาแล้วได้</p>
        <button class="btn btn-primary mt-3" onclick="window.location.reload()">ลองอีกครั้ง</button>
    </div>
</body>
</html>
